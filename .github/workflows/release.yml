name: Release & Deploy

on:
  push:
    branches:
      - minhas-customizacoes

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: rkllama
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Get current version
        id: version
        run: |
          CURRENT_VERSION=$(grep 'version = ' pyproject.toml | head -1 | cut -d'"' -f2)
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $CURRENT_VERSION"

      - name: Calculate new version
        id: new_version
        run: |
          CURRENT=${{ steps.version.outputs.current_version }}

          # Se ainda é 0.0.x, muda para 1.0.0
          if [[ $CURRENT == 0.0.* ]]; then
            NEW_VERSION="1.0.0"
          else
            # Incrementa patch version
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            PATCH=$((PATCH + 1))
            NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          fi

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"

      - name: Update version in pyproject.toml
        run: |
          sed -i 's/version = ".*"/version = "${{ steps.new_version.outputs.new_version }}"/' pyproject.toml
          cat pyproject.toml | grep version

      - name: Commit version update
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add pyproject.toml
          git commit -m "chore: bump version to ${{ steps.new_version.outputs.new_version }}"
          git push

      - name: Create tag
        run: |
          git tag -a "v${{ steps.new_version.outputs.new_version }}" -m "Release ${{ steps.new_version.outputs.new_version }}"
          git push origin "v${{ steps.new_version.outputs.new_version }}"

      - name: Get commit history for release notes
        id: commit_log
        run: |
          # Get commits since last tag
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --oneline --pretty=format:"- %h: %s" | head -20)
          else
            COMMITS=$(git log $PREV_TAG..HEAD --oneline --pretty=format:"- %h: %s")
          fi

          echo "commits<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "v${{ steps.new_version.outputs.new_version }}"
          release_name: "Release ${{ steps.new_version.outputs.new_version }}"
          body: |
            ## Changes
            ${{ steps.commit_log.outputs.commits }}

            **Docker Image:** `${{ env.DOCKER_USERNAME }}/rkllama:${{ steps.new_version.outputs.new_version }}`
            **Latest:** `${{ env.DOCKER_USERNAME }}/rkllama:latest`
          draft: false
          prerelease: false
        env:
          DOCKER_USERNAME: ${{ vars.USERNAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ vars.USERNAME }}
          password: ${{ secrets.APIKEY }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ vars.USERNAME }}/rkllama:${{ steps.new_version.outputs.new_version }}
            ${{ vars.USERNAME }}/rkllama:latest
          platforms: linux/arm64,linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
