name: Release & Deploy

on:
  push:
    branches:
      - minhas-customizacoes

jobs:
  check-version:
    name: Check Version Change
    runs-on: ubuntu-latest
    outputs:
      should-release: ${{ steps.check.outputs.should-release }}
      current-version: ${{ steps.check.outputs.current-version }}
      last-tag-version: ${{ steps.check.outputs.last-tag-version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if version changed
        id: check
        run: |
          # Get current version from pyproject.toml
          CURRENT_VERSION=$(grep 'version = ' pyproject.toml | head -1 | cut -d'"' -f2)
          echo "current-version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

          # Get last tag version
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -z "$LAST_TAG" ]; then
            # No tags exist yet
            LAST_TAG_VERSION="none"
            SHOULD_RELEASE="true"
            echo "No tags found. Will create first release."
          else
            # Extract version from tag (remove 'v' prefix)
            LAST_TAG_VERSION=${LAST_TAG#v}

            if [ "$CURRENT_VERSION" = "$LAST_TAG_VERSION" ]; then
              SHOULD_RELEASE="false"
              echo "Version unchanged: $CURRENT_VERSION == $LAST_TAG_VERSION. Skipping release."
            else
              SHOULD_RELEASE="true"
              echo "Version changed: $CURRENT_VERSION != $LAST_TAG_VERSION. Creating release."
            fi
          fi

          echo "last-tag-version=$LAST_TAG_VERSION" >> $GITHUB_OUTPUT
          echo "should-release=$SHOULD_RELEASE" >> $GITHUB_OUTPUT

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: check-version
    if: needs.check-version.outputs.should-release == 'true'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: "HEAD"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          tags: |
            rkllama:${{ needs.check-version.outputs.current-version }}
            rkllama:latest
          platforms: linux/arm64,linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-release:
    name: Create Release & Tag
    runs-on: ubuntu-latest
    needs: [check-version, build-docker]
    if: needs.check-version.outputs.should-release == 'true'
    permissions:
      contents: write
    outputs:
      version: ${{ needs.check-version.outputs.current-version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create tag
        run: |
          VERSION=${{ needs.check-version.outputs.current-version }}
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git tag -a "v$VERSION" -m "Release $VERSION"
          git push origin "v$VERSION"

      - name: Get commit history for release notes
        id: commit_log
        run: |
          # Get previous tag to extract commits since then
          CURRENT_TAG="v${{ needs.check-version.outputs.current-version }}"
          PREV_TAG=$(git describe --tags --abbrev=0 "$CURRENT_TAG"^ 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            # First release - get all commits
            COMMITS=$(git log --oneline --pretty=format:"- %h: %s")
          else
            # Get commits since previous tag
            COMMITS=$(git log "$PREV_TAG".."$CURRENT_TAG" --oneline --pretty=format:"- %h: %s")
          fi

          echo "commits<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "v${{ needs.check-version.outputs.current-version }}"
          release_name: "Release ${{ needs.check-version.outputs.current-version }}"
          body: |
            ## Changes
            ${{ steps.commit_log.outputs.commits }}
          draft: false
          prerelease: false

  push-docker-hub:
    name: Push to Docker Hub
    runs-on: ubuntu-latest
    needs: [check-version, create-release]
    if: needs.check-version.outputs.should-release == 'true'
    environment:
      name: rkllama
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: "v${{ needs.check-version.outputs.current-version }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ vars.USERNAME }}
          password: ${{ secrets.APIKEY }}

      - name: Build and push to Docker Hub
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ vars.USERNAME }}/rkllama:${{ needs.check-version.outputs.current-version }}
            ${{ vars.USERNAME }}/rkllama:latest
          platforms: linux/arm64,linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update release with Docker image info
        uses: actions/github-script@v7
        with:
          script: |
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const release = releases.data.find(r =>
              r.tag_name === 'v${{ needs.check-version.outputs.current-version }}'
            );

            if (release) {
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
                body: release.body + `\n\n## Docker Image\n\`\`\`\n${{ vars.USERNAME }}/rkllama:${{ needs.check-version.outputs.current-version }}\n${{ vars.USERNAME }}/rkllama:latest\n\`\`\``
              });
            }
