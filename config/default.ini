; Default Configuration for RKLLAMA
; This file will be automatically generated at startup if it does not exist
; To override these settings, create a file named rkllama.ini in the config directory
; and copy the settings you want to change from this file to that file

[server]
port = 8080
host = 0.0.0.0
debug = false

[paths]
models = models
logs = logs
data = data
src = src
lib = lib
temp = temp

[model]
default =
max_minutes_loaded_in_memory = 30
max_number_models_loaded_in_memory = 1
max_seconds_waiting_worker_response = 600
max_days_prompt_cache = 1
single_model_mode = true
llama_cpp_threads = 4
rkllm_cpu_threads = 0
rkllm_prefill_batch = 1

[platform]
processor = rk3588s
